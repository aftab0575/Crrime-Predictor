<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Crime Predictor{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      crossorigin="anonymous"
    />
    <link
      href="{{ url_for('static', filename='css/styles.css') }}"
      rel="stylesheet"
    />
    {% block head_extra %}{% endblock %}
  </head>
  <body class="d-flex flex-column min-vh-100 site-body">
    <header class="site-header">
      <a
        class="skip-link visually-hidden-focusable btn btn-sm btn-light shadow-sm fw-semibold border position-fixed top-0 start-0 mt-3 ms-3 text-dark"
        href="#main-content"
        >Skip to main content</a
      >
      <nav
        id="site-navbar"
        class="navbar navbar-expand-lg navbar-light site-navbar sticky-top"
        aria-label="Primary"
      >
        <div class="site-container position-relative">
          <a class="navbar-brand site-navbar-brand" href="{{ url_for('main.index') }}">
            <span class="site-navbar-brand-icon" aria-hidden="true">
              <i class="bi bi-shield-check"></i>
            </span>
            <span class="site-navbar-brand-text">Crime Predictor</span>
          </a>
          <button
            class="navbar-toggler site-navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-lg-auto align-items-lg-center gap-lg-1 site-navbar-nav">
              <li class="nav-item">
                <a
                  class="nav-link site-nav-link {% if request.endpoint == 'main.index' %}active{% endif %}"
                  href="{{ url_for('main.index') }}"
                  {% if request.endpoint == 'main.index' %}aria-current="page"{% endif %}
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link site-nav-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}"
                  href="{{ url_for('main.dashboard') }}"
                  {% if request.endpoint == 'main.dashboard' %}aria-current="page"{% endif %}
                  >Dashboard</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link site-nav-link {% if request.endpoint == 'main.predict' %}active{% endif %}"
                  href="{{ url_for('main.predict') }}"
                  {% if request.endpoint == 'main.predict' %}aria-current="page"{% endif %}
                  >Predict</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link site-nav-link {% if request.endpoint == 'main.train' %}active{% endif %}"
                  href="{{ url_for('main.train') }}"
                  {% if request.endpoint == 'main.train' %}aria-current="page"{% endif %}
                  >Train</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link site-nav-link {% if request.endpoint == 'main.assistant' %}active{% endif %}"
                  href="{{ url_for('main.assistant') }}"
                  {% if request.endpoint == 'main.assistant' %}aria-current="page"{% endif %}
                  >Assistant</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link site-nav-link {% if request.endpoint == 'main.about' %}active{% endif %}"
                  href="{{ url_for('main.about') }}"
                  {% if request.endpoint == 'main.about' %}aria-current="page"{% endif %}
                  >About</a
                >
              </li>
              <li class="nav-item site-nav-cta-wrap">
                <a
                  class="btn site-nav-cta"
                  href="{{ url_for('main.predict') }}"
                >
                  Get Started
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main id="main-content" class="flex-grow-1 site-main" tabindex="-1">
      {% block hero %}{% endblock %}
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer mt-auto py-4 text-center small">
      <div class="site-container text-muted">Crime Data Analysis &amp; Prediction — FYP</div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="{{ url_for('static', filename='js/navbar.js') }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
